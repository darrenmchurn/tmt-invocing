<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMT Invoicing — New Invoice</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

<nav class="top-nav">
  <span class="brand">TMT Waste Solutions</span>
  <a href="index.html" class="active">New Invoice</a>
  <a href="history.html">History</a>
  <a href="billing-codes.html">Billing Codes</a>
</nav>

<div class="page-wrap">

  <div id="alert-box" class="alert" style="display:none"></div>

  <!-- Hidden state fields -->
  <input type="hidden" id="inv-version" value="1">
  <input type="hidden" id="inv-created-at" value="">

  <!-- Action bar -->
  <div class="action-bar no-print" style="margin-bottom:20px">
    <button class="btn btn-primary" id="btn-save">&#128190; Save Invoice</button>
    <button class="btn btn-accent" id="btn-pdf">&#128196; Export PDF</button>
    <button class="btn btn-ghost" id="btn-new">&#43; New Invoice</button>
    <a class="btn btn-ghost" href="history.html">&#128203; View History</a>
  </div>

  <!-- Invoice form card -->
  <div class="card">
    <div class="card-title">Invoice Details</div>

    <!-- Company header -->
    <div class="invoice-header">
      <div class="company-block">
        <div class="company-name">TMT Waste Solutions</div>
        <div class="company-sub" id="company-sub"></div>
      </div>
      <div class="invoice-meta-block">
        <div class="inv-number">
          <label>Invoice # <span id="version-badge" class="version-badge" style="display:none">v1</span></label>
          <input type="text" id="inv-number" class="inv-number-input" placeholder="INV-001" autocomplete="off">
        </div>
        <div class="inv-dates">
          <div class="field-group col-2">
            <div>
              <label>Invoice Date</label>
              <input type="date" id="inv-date">
            </div>
            <div>
              <label>Due Date</label>
              <input type="date" id="inv-due">
            </div>
          </div>
          <div>
            <label>Payment Terms</label>
            <select id="inv-terms">
              <option>Due on Receipt</option>
              <option>Net 15</option>
              <option>Net 30</option>
              <option>Net 60</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Client info -->
    <div class="card-title" style="margin-top:20px">Bill To</div>
    <div class="field-group col-2">
      <div>
        <label>Client Name *</label>
        <input type="text" id="client-name" placeholder="Full name or company" autocomplete="name">
      </div>
      <div>
        <label>Client Phone</label>
        <input type="tel" id="client-phone" placeholder="(555) 000-0000" autocomplete="tel" inputmode="tel">
      </div>
    </div>
    <div class="field-group col-2" style="margin-top:14px">
      <div>
        <label>Client Email</label>
        <input type="email" id="client-email" placeholder="email@example.com" autocomplete="email" inputmode="email">
      </div>
      <div>
        <label>Service / Client Address</label>
        <textarea id="client-address" rows="2" placeholder="Street, City, State, ZIP" autocomplete="street-address"></textarea>
      </div>
    </div>

    <!-- Rental Details -->
    <div class="card-title" style="margin-top:24px">Rental Details</div>
    <div class="field-group col-3">
      <div>
        <label>Drop Off Date</label>
        <input type="date" id="rental-drop">
      </div>
      <div>
        <label>Pickup Date</label>
        <input type="date" id="rental-pick">
      </div>
      <div>
        <label>Rental Duration (days)</label>
        <input type="number" id="rental-duration" min="1" max="365" step="1" placeholder="e.g. 3" inputmode="numeric">
      </div>
    </div>

    <!-- Line items -->
    <div class="card-title" style="margin-top:24px">Services</div>
    <div class="line-items-scroll">
      <table class="line-items-table">
        <thead>
          <tr>
            <th class="col-type">Billing Code</th>
            <th class="col-desc">Description</th>
            <th class="col-qty">Qty</th>
            <th class="col-rate">Rate ($)</th>
            <th class="col-total">Amount</th>
            <th class="col-del"></th>
          </tr>
        </thead>
        <tbody id="line-items-body"></tbody>
      </table>
    </div>
    <button class="btn btn-ghost btn-sm add-line-btn no-print" id="btn-add-row">&#43; Add Line Item</button>

    <!-- Totals -->
    <div class="totals-block">
      <table class="totals-table">
        <tr>
          <td>Subtotal</td>
          <td id="subtotal-display">$0.00</td>
        </tr>
        <tr>
          <td>
            <div class="tax-rate-field">
              Tax
              <input type="number" id="tax-rate" value="8.25" min="0" max="100" step="0.01" inputmode="decimal">
              <span>%</span>
            </div>
          </td>
          <td id="tax-amt-display">$0.00</td>
        </tr>
        <tr class="total-row">
          <td>Total</td>
          <td id="total-display">$0.00</td>
        </tr>
        <tr>
          <td>Amount Paid ($)</td>
          <td><input type="number" id="paid-amount" value="0" min="0" step="0.01"
               placeholder="0.00" inputmode="decimal" style="text-align:right"></td>
        </tr>
        <tr class="balance-row">
          <td>Balance Due</td>
          <td id="balance-display">$0.00</td>
        </tr>
      </table>
    </div>

    <!-- Notes -->
    <div style="margin-top:20px">
      <label>Notes / Memo (optional)</label>
      <textarea id="notes" placeholder="Special instructions, job site details, etc."></textarea>
    </div>

    <!-- Payment link -->
    <div style="margin-top:14px">
      <label>Payment Link (optional)</label>
      <input type="url" id="payment-link-input" placeholder="https://venmo.com/u/yourname" inputmode="url" autocomplete="url">
    </div>
  </div>

  <!-- Hidden invoice preview div used by html2canvas for PDF -->
  <div id="invoice-preview" style="position:fixed;visibility:hidden;pointer-events:none;left:0;top:0;width:750px;z-index:-1"></div>

</div>

<!-- CDN libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js?v=4"></script>
</body>
</html>
