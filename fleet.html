<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMT Invoicing — Fleet Status</title>
  <script src="auth.js?v=6"></script>
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>

<nav class="top-nav">
  <span class="brand">TMT Waste Solutions</span>
  <a href="index.html">New Invoice</a>
  <a href="history.html">History</a>
  <a href="fleet.html" class="active">Fleet</a>
  <a href="billing-codes.html">Billing Codes</a>
</nav>

<div class="page-wrap">

  <div id="alert-box" class="alert" style="display:none"></div>

  <!-- Page header -->
  <div class="fleet-page-header">
    <h1 class="fleet-title">Bin Fleet Status</h1>
    <div class="fleet-legend">
      <span class="legend-item"><span class="legend-dot dot-available"></span>Available</span>
      <span class="legend-item"><span class="legend-dot dot-scheduled"></span>Scheduled</span>
      <span class="legend-item"><span class="legend-dot dot-rented"></span>Rented</span>
      <span class="legend-item"><span class="legend-dot dot-pickup-due"></span>Pickup Due ≤24 hrs</span>
      <span class="legend-item"><span class="legend-dot dot-overdue"></span>Overdue</span>
    </div>
  </div>

  <!-- Summary bar -->
  <div class="fleet-summary" id="fleet-summary"></div>

  <!-- Fleet table -->
  <div class="card" style="padding:0; margin-bottom:24px">
    <div class="history-scroll">
      <table class="fleet-table" id="fleet-table">
        <thead>
          <tr>
            <th>Bin ID</th>
            <th>Status</th>
            <th>Drop-Off Date</th>
            <th>Expected Pickup</th>
            <th>Days Rented</th>
            <th>Days Until Pickup</th>
            <th>Current Client</th>
            <th>Current Job #</th>
          </tr>
        </thead>
        <tbody id="fleet-body"></tbody>
      </table>
    </div>
    <div id="fleet-empty" class="empty-state" style="display:none">
      <p>No bins configured yet.</p>
    </div>
  </div>

</div><!-- /page-wrap -->

<script src="fleet.js?v=6"></script>
</body>
</html>
