<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMT Invoicing — New Invoice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="top-nav">
  <span class="brand">TMT Waste Solutions</span>
  <a href="index.html" class="active">New Invoice</a>
  <a href="history.html">Invoice History</a>
</nav>

<div class="page-wrap">

  <div id="alert-box" class="alert" style="display:none"></div>

  <!-- Action bar -->
  <div class="action-bar no-print" style="margin-bottom:20px">
    <button class="btn btn-primary" id="btn-save">&#128190; Save Invoice</button>
    <button class="btn btn-accent" id="btn-pdf">&#128196; Export PDF</button>
    <button class="btn btn-ghost" id="btn-new">&#43; New Invoice</button>
    <a class="btn btn-ghost" href="history.html">&#128203; View History</a>
  </div>

  <!-- Invoice form card -->
  <div class="card">
    <div class="card-title">Invoice Details</div>

    <!-- Company header -->
    <div class="invoice-header">
      <div class="company-block">
        <div class="company-name">TMT Waste Solutions</div>
        <div class="company-sub" id="company-sub"></div>
      </div>
      <div class="invoice-meta-block">
        <div class="inv-number">
          <input type="text" id="inv-number" style="width:160px;text-align:right;font-weight:700;font-size:16px" placeholder="INV-001">
        </div>
        <div class="inv-dates" style="margin-top:8px">
          <div class="field-group col-2" style="gap:8px;margin-top:6px">
            <div>
              <label>Invoice Date</label>
              <input type="date" id="inv-date">
            </div>
            <div>
              <label>Due Date</label>
              <input type="date" id="inv-due">
            </div>
          </div>
          <div style="margin-top:8px">
            <label>Payment Terms</label>
            <select id="inv-terms">
              <option>Due on Receipt</option>
              <option>Net 15</option>
              <option>Net 30</option>
              <option>Net 60</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Client info -->
    <div class="card-title" style="margin-top:20px">Bill To</div>
    <div class="field-group col-2">
      <div>
        <label>Client Name *</label>
        <input type="text" id="client-name" placeholder="Full name or company">
      </div>
      <div>
        <label>Client Phone</label>
        <input type="tel" id="client-phone" placeholder="(555) 000-0000">
      </div>
    </div>
    <div class="field-group col-2" style="margin-top:14px">
      <div>
        <label>Client Email</label>
        <input type="email" id="client-email" placeholder="email@example.com">
      </div>
      <div>
        <label>Service Address / Client Address</label>
        <textarea id="client-address" rows="2" placeholder="Street, City, State, ZIP"></textarea>
      </div>
    </div>

    <!-- Line items -->
    <div class="card-title" style="margin-top:24px">Services</div>
    <div style="overflow-x:auto">
      <table class="line-items-table">
        <thead>
          <tr>
            <th class="col-type">Type</th>
            <th class="col-desc">Description</th>
            <th class="col-qty">Qty</th>
            <th class="col-rate">Rate ($)</th>
            <th class="col-total">Amount</th>
            <th class="col-del"></th>
          </tr>
        </thead>
        <tbody id="line-items-body">
          <!-- rows injected by app.js -->
        </tbody>
      </table>
    </div>
    <button class="btn btn-ghost btn-sm add-line-btn no-print" id="btn-add-row">&#43; Add Line Item</button>

    <!-- Totals -->
    <div class="totals-block">
      <table class="totals-table">
        <tr>
          <td>Subtotal</td>
          <td id="subtotal-display">$0.00</td>
        </tr>
        <tr>
          <td>
            <div class="tax-rate-field">
              Tax
              <input type="number" id="tax-rate" value="0" min="0" max="100" step="0.01" style="width:58px">
              <span>%</span>
            </div>
          </td>
          <td id="tax-amt-display">$0.00</td>
        </tr>
        <tr class="total-row">
          <td>Total</td>
          <td id="total-display">$0.00</td>
        </tr>
      </table>
    </div>

    <!-- Payment link -->
    <div class="payment-link-block" id="payment-link-display" style="display:none"></div>

    <!-- Notes -->
    <div style="margin-top:20px">
      <label>Notes / Memo (optional)</label>
      <textarea id="notes" placeholder="Special instructions, job site details, etc."></textarea>
    </div>
  </div>

  <!-- Hidden invoice preview div used by html2canvas for PDF -->
  <div id="invoice-preview" style="display:none;position:absolute;left:-9999px;top:0;width:750px"></div>

</div><!-- /page-wrap -->

<!-- CDN libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
